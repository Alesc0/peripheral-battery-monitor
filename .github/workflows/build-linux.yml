name: Build Linux executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x64 executable
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libudev-dev libxdo-dev

      - name: Build executable
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Stage artifact
        run: |
          install -Dm755 target/x86_64-unknown-linux-gnu/release/peripheral-battery-monitor dist/linux/peripheral-battery-monitor
          install -Dm644 packaging/70-peripheral-battery-monitor.rules dist/linux/packaging/70-peripheral-battery-monitor.rules

      - name: Upload executable and receiver permission rules
        uses: actions/upload-artifact@v7
        with:
          name: peripheral-battery-monitor-linux-x64
          path: dist/linux/
          if-no-files-found: error
          retention-days: 90
