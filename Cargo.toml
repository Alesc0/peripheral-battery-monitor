[package]
name = "peripheral-battery-monitor"
version = "0.1.0"
edition = "2024"
description = "Windows and Linux system tray battery monitor for supported peripherals"

[dependencies]
getrandom = "0.3"
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
winit = "0.30.12"
winreg = "0.55.0"

[target.'cfg(target_os = "linux")'.dependencies]
# StatusNotifier supports hover tooltips; the AppIndicator backend ignores them.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni", "muda-gtk3"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] }
gtk = "0.18"

[profile.release]
lto = true
codegen-units = 1
strip = true
